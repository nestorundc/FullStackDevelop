<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica 5 - Asincronía</title>
  <style>
    /* Un poco de CSS para que la galería se vea ordenada (Extraído del PDF) */
    #galeria {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      padding: 16px;
    }
    #galeria div {
      text-align: center;
    }
    #galeria img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }
    #galeria p {
      font-size: 14px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- EJEMPLO 1: Lista de Usuarios (Sección 4.2 del PDF) -->
  <h1>Usuarios</h1>
  <ul id="lista"></ul>

  <hr>

  <!-- EJEMPLO 2: Galería de Fotos con Picsum (Sección 4.2 del PDF) -->
  <h1>Galería de Fotos</h1>
  <div id="galeria"></div>

  <script>
    // ==========================================
    // 4.1 Problema básico
    // ==========================================
    console.log("--- 4.1 Problema básico ---");
    console.log("Inicio");
    console.log("Proceso");
    console.log("Fin");


    // ==========================================
    // 4.2 Callback Sincrónico
    // ==========================================
    console.log("--- 4.2 Callback Sincrónico ---");
    function procesarUsuario(nombre, callback) {
      console.log(`Procesando ${nombre}`);
      callback(); // se ejecuta inmediatamente después
    }

    procesarUsuario("Claudio", function () {
      console.log("Proceso terminado");
    });


    // ==========================================
    // 4.2 Callback Asincrónico con setTimeout
    // ==========================================
    console.log("--- Callback Asincrónico con setTimeout ---");
    console.log("Inicio");
    setTimeout(() => {
      console.log("Proceso terminado");
    }, 2000);
    console.log("Fin");


    // ==========================================
    // 4.2 Ejemplo Base fetch() en consola
    // ==========================================
    console.log("--- Ejemplo base fetch ---");
    console.log("Inicio");
    fetch("https://jsonplaceholder.typicode.com/posts/1")
      .then(res => res.json())
      .then(data => console.log("Datos recibidos:", data));
    console.log("Fin");


    // ==========================================
    // 4.2 fetch() Usuarios -> DOM
    // ==========================================
    const lista = document.getElementById("lista");

    fetch("https://jsonplaceholder.typicode.com/users")
      .then(respuesta => respuesta.json()) // convertimos la respuesta a JSON
      .then(usuarios => {
        usuarios.forEach(usuario => {
          const li = document.createElement("li");
          li.textContent = usuario.name; // mostramos el nombre del usuario
          lista.appendChild(li);
        });
      })
      .catch(error => {
        console.error("Error al cargar datos:", error);
      });


    // ==========================================
    // 4.2 fetch() Fotos con Picsum -> DOM
    // ==========================================
    const galeria = document.getElementById("galeria");

    // Traemos 5 fotos de prueba
    fetch("https://jsonplaceholder.typicode.com/photos?_limit=5")
      .then(respuesta => respuesta.json())
      .then(fotos => {
        fotos.forEach(foto => {
          const div = document.createElement("div");
          const img = document.createElement("img");
          
          // Usamos Picsum en lugar de foto.thumbnailUrl
          // Usamos el id de la foto para que cada imagen sea diferente
          img.src = `https://picsum.photos/id/${foto.id}/150/150`;
          img.alt = foto.title;
          
          const p = document.createElement("p");
          p.textContent = foto.title;
          
          div.appendChild(img);
          div.appendChild(p);
          galeria.appendChild(div);
        });
      })
      .catch(error => {
        console.error("Error al cargar fotos:", error);
      });


    // ==========================================
    // 4.3 Promises
    // ==========================================
    console.log("--- 4.3 Promises ---");
    
    // 1. CREACIÓN DE LA PROMESA (Función que simula la petición)
    function consultarBaseDeDatos(idUsuario) {
      return new Promise((resolve, reject) => {
        console.log("1. Buscando usuario en la base de datos...");
        // Simula 2 segundos de retraso de red
        setTimeout(() => {
          const conexionExitosa = true; // Cambia a 'false' para probar el caso de error
          if (conexionExitosa) {
            const usuario = { id: idUsuario, nombre: "Lucía", rol: "Desarrolladora" };
            resolve(usuario); // Éxito: pasa los datos a la promesa
          } else {
            reject("Error 500: No se pudo conectar con la base de datos."); // Fallo
          }
        }, 2000);
      });
    }

    // 2. CONSUMO DE LA PROMESA
    console.log("A. Inicio del programa");
    consultarBaseDeDatos(10)
      .then((datos) => {
        // Se ejecuta solo si la promesa fue resuelta (resolve)
        console.log("2. Datos recuperados con éxito:", datos);
      })
      .catch((error) => {
        // Se ejecuta solo si la promesa fue rechazada (reject)
        console.error("2. Ocurrió un problema:", error);
      })
      .finally(() => {
        // Se ejecuta SIEMPRE al terminar, haya éxito o error
        console.log("3. Operación asíncrona completada.");
      });
    console.log("B. El código sigue su camino sin esperar...");


    // ==========================================
    // 4.5 async / await
    // ==========================================
    console.log("--- 4.5 async/await ---");
    
    // 1. Declaramos la función con 'async' para poder usar 'await' dentro
    async function obtenerUsuario() {
      try {
        // 2. 'await' detiene la ejecución hasta que fetch() recibe la respuesta de la red
        const respuesta = await fetch('https://jsonplaceholder.typicode.com/users/1');
        // 3. Convertimos la respuesta a un objeto JSON (también requiere 'await')
        const usuario = await respuesta.json();
        // 4. Usamos los datos obtenidos
        console.log("Nombre:", usuario.name);
        console.log("Email:", usuario.email);
      } catch (error) {
        // Si la red falla o la URL no existe, se captura el error aquí
        console.error("Error al obtener los datos:", error);
      }
    }

    // Llamada a la función
    obtenerUsuario();
  </script>
</body>
</html>
