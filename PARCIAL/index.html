<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación Parcial - EmailJS UNDC</title>
  
  <!-- Estilos CSS independientes -->
  <link rel="stylesheet" href="styles.css">

  <!-- SDK oficial de EmailJS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

  <div class="card">
    <h2>Formulario de Contacto</h2>
    
    <form id="contact-form">
      <div class="field">
        <label for="from_name">Nombre completo:</label>
        <input type="text" id="from_name" name="from_name" placeholder="Ej: Néstor Villalba" required>
      </div>

      <div class="field">
        <label for="from_email">Correo electrónico:</label>
        <input type="email" id="from_email" name="from_email" placeholder="2511020365@undc.edu.pe" required>
      </div>

      <div class="field">
        <label for="message">Mensaje:</label>
        <textarea id="message" name="message" rows="4" placeholder="Escribe tu mensaje..." required></textarea>
      </div>

      <button type="submit" id="btn-send">Enviar Mensaje</button>
    </form>

    <div id="response-msg" class="hidden"></div>
  </div>

  <!-- Archivo JavaScript independiente -->
  <script src="script.js"></script>
</body>
</html>
